[build-system]
requires = ["uv-build>=0.8.0,<0.9"]
build-backend = "uv_build"

[project]
name = "fenix"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nathan Lugg", email = "nrlugg@gmail.com" },
]

requires-python = ">=3.13"

dependencies = [
    "fsspec>=2025.7.0",
    "numpy>=2.3.1",
    "pyarrow>=21.0.0",
]

[dependency-groups]
dev = [
    "altair>=5.5.0",
    "ipykernel>=6.30.0",
    "ipywidgets>=8.1.7",
    "isort>=6.0.1",
    "jupyterlab>=4.4.5",
    "mypy>=1.17.0",
    "plotly>=6.2.0",
    "ruff>=0.12.4",
]


[tool.mypy]
disable_error_code = ["import-not-found", "import-untyped"]

[tool.ruff]
extend-include = ["*.ipynb"]
indent-width = 4
line-length = 99

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint.isort]
case-sensitive = true
extra-standard-library = []
force-wrap-aliases = true
combine-as-imports = true
force-sort-within-sections = true


[tool.ruff.per-file-ignores]
"__init__.py" = ["E402", "F401"]
